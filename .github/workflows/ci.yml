name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests (HR tools, chunking, security layer, LangChain and LangGraph wiring, API)
        run: pytest -q
      - name: Offline pipeline
        run: python main.py --quiet

  multi-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install with CrewAI and Agno
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt -r requirements-multiagent.txt
      - name: Tests including the CrewAI and Agno builds
        run: uv run pytest -q
